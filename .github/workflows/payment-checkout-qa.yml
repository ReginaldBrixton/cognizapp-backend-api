name: Payment checkout verification
on:
  push:
    branches: [diagnostics/payment-checkout-20261125]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run typecheck
      - run: bun test tests/paystack-service.test.ts tests/payment-policy.test.ts
