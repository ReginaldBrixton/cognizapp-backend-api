name: Payment checkout verification
on:
  push:
    branches: [diagnostics/payment-native-20261125]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      DATABASE_URL_DEV: postgresql://test:test@127.0.0.1:5432/cognizap
      JWT_SECRET: test-only-local-fixture-not-a-production-secret
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run typecheck
      - run: bun test tests/paystack-service.test.ts tests/payment-policy.test.ts
      - run: bun build api/index.ts --target=bun --outdir /tmp/cognizapp-bundle
